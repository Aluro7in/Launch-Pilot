<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="border-radius: 16px; overflow: hidden; background: #0b0d19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="auroraIndigo" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraCyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraPink" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Element Gradients -->
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b8d4"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4"/>
    </linearGradient>
    
    <!-- CSS Animations -->
    <style>
      @keyframes float-hero {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes float-rocket {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(5px, -8px) rotate(-1deg); }
      }
      @keyframes flame-pulse {
        0% { transform: scaleY(0.9) scaleX(0.95); opacity: 0.8; }
        100% { transform: scaleY(1.2) scaleX(1.05); opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes pulse-ring {
        0% { r: 4px; opacity: 0.8; }
        100% { r: 16px; opacity: 0; }
      }
      @keyframes aurora-slow {
        0% { transform: scale(1) translate(0px, 0px); }
        50% { transform: scale(1.1) translate(-20px, 15px); }
        100% { transform: scale(1) translate(0px, 0px); }
      }
      @keyframes chat-bubble-1 {
        0%, 90% { transform: translateY(5px); opacity: 0; }
        10%, 40% { transform: translateY(0px); opacity: 1; }
        45%, 85% { transform: translateY(-15px); opacity: 0; }
      }
      @keyframes chat-bubble-2 {
        0%, 25%, 100% { transform: translateY(5px); opacity: 0; }
        35%, 65% { transform: translateY(0px); opacity: 1; }
        70%, 95% { transform: translateY(-15px); opacity: 0; }
      }
      @keyframes check-reveal {
        0%, 100% { stroke-dashoffset: 20; opacity: 0.2; }
        30%, 80% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes bar-grow {
        0%, 100% { width: 40px; }
        50% { width: 140px; }
      }
      
      .star-fast { animation: blink 1.5s infinite ease-in-out; }
      .star-slow { animation: blink 3s infinite ease-in-out; }
      .star-delayed { animation: blink 2.2s infinite ease-in-out; animation-delay: 0.7s; }
      .aurora-layer { transform-origin: center; animation: aurora-slow 15s infinite ease-in-out; }
      .floating-dashboard { animation: float-hero 6s infinite ease-in-out; }
      .rocket-group { animation: float-rocket 4s infinite ease-in-out; transform-origin: 400px 180px; }
      .thruster-flame { animation: flame-pulse 0.15s infinite alternate ease-in-out; transform-origin: 390px 240px; }
      .pulse-circle { animation: pulse-ring 2s infinite cubic-bezier(0.215, 0.610, 0.355, 1); transform-origin: 660px 80px; }
      .chat-msg-1 { animation: chat-bubble-1 8s infinite ease-in-out; }
      .chat-msg-2 { animation: chat-bubble-2 8s infinite ease-in-out; }
      .animated-check { stroke-dasharray: 20; animation: check-reveal 5s infinite ease-in-out; }
      .progress-fill { animation: bar-grow 8s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="100%" height="100%" fill="#07080e"/>

  <!-- Glowing Aurora Blobs -->
  <circle class="aurora-layer" cx="150" cy="120" r="250" fill="url(#auroraIndigo)"/>
  <circle class="aurora-layer" cx="650" cy="280" r="220" fill="url(#auroraCyan)" style="animation-delay: -5s;"/>
  <circle class="aurora-layer" cx="400" cy="200" r="180" fill="url(#auroraPink)" style="animation-delay: -10s;"/>

  <!-- Stars / Tiny Particles -->
  <g fill="#ffffff">
    <circle class="star-fast" cx="80" cy="70" r="1" />
    <circle class="star-slow" cx="240" cy="40" r="1.5" />
    <circle class="star-delayed" cx="120" cy="300" r="1" />
    <circle class="star-fast" cx="720" cy="140" r="1.2" />
    <circle class="star-slow" cx="680" cy="320" r="1.5" />
    <circle class="star-delayed" cx="350" cy="50" r="0.8" />
    <circle class="star-fast" cx="500" cy="340" r="1" />
    <circle class="star-slow" cx="50" cy="180" r="1.2" />
  </g>

  <!-- Abstract Cosmic Grid/Constellations -->
  <path d="M 50,150 L 100,120 L 150,160 M 700,200 L 740,240 L 710,290" stroke="#334155" stroke-width="0.5" stroke-dasharray="3 3" fill="none" opacity="0.6"/>

  <!-- FLOATING DASHBOARD WINDOW -->
  <g class="floating-dashboard">
    <!-- Main Glass Window -->
    <rect x="100" y="60" width="600" height="280" rx="12" fill="url(#glassGrad)" stroke="#334155" stroke-width="1" />
    <!-- Window Bar -->
    <path d="M 100,85 L 700,85" stroke="#334155" stroke-width="1" />
    <!-- Window Dots -->
    <circle cx="120" cy="72" r="4" fill="#ef4444" />
    <circle cx="132" cy="72" r="4" fill="#f59e0b" />
    <circle cx="144" cy="72" r="4" fill="#10b981" />
    <!-- Center Mock Title -->
    <text x="400" y="76" fill="#94a3b8" font-size="11" text-anchor="middle" font-weight="600" letter-spacing="1">LAUNCHPILOT WORKSPACE</text>

    <!-- LEFT PANEL: AI Assistant Sidebar -->
    <g transform="translate(100, 85)">
      <!-- Sidebar BG -->
      <rect x="0" y="0" width="180" height="255" rx="0" fill="url(#sidebarGrad)" stroke="#334155" stroke-width="0" style="clip-path: inset(0px 0px 12px 12px);"/>
      <path d="M 180,0 L 180,255" stroke="#334155" stroke-width="1" />
      
      <!-- AI Status Header -->
      <circle cx="25" cy="25" r="5" fill="#10b981" />
      <circle class="star-fast" cx="25" cy="25" r="8" stroke="#10b981" stroke-width="1" fill="none" />
      <text x="40" y="29" fill="#e2e8f0" font-size="11" font-weight="700">Copilot Panel</text>
      
      <!-- Chat message 1 (User Idea) -->
      <g class="chat-msg-1" transform="translate(15, 55)">
        <rect x="0" y="0" width="150" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="0.5" />
        <text x="10" y="16" fill="#38bdf8" font-size="9" font-weight="bold">USER BRIEF</text>
        <text x="10" y="30" fill="#94a3b8" font-size="9">Build a collaborative wiki...</text>
      </g>

      <!-- Chat message 2 (AI Response) -->
      <g class="chat-msg-2" transform="translate(15, 110)">
        <rect x="0" y="0" width="150" height="52" rx="8" fill="#312e81" fill-opacity="0.4" stroke="#6366f1" stroke-width="0.5" />
        <text x="10" y="16" fill="#a78bfa" font-size="9" font-weight="bold">AI ASSISTANT 🚀</text>
        <text x="10" y="30" fill="#cbd5e1" font-size="8.5">Launch checklist, risk factors</text>
        <text x="10" y="42" fill="#cbd5e1" font-size="8.5">and targets generated!</text>
      </g>

      <!-- Accent elements in sidebar -->
      <line x1="15" y1="185" x2="165" y2="185" stroke="#334155" stroke-width="1" />
      <rect x="15" y="198" width="100" height="8" rx="4" fill="#334155" />
      <rect x="15" y="212" width="60" height="8" rx="4" fill="#1e293b" />
    </g>

    <!-- RIGHT PANEL: Launch pack layout -->
    <g transform="translate(295, 100)">
      <!-- Main launch state header -->
      <text x="0" y="15" fill="#f8fafc" font-size="14" font-weight="800">🚀 Collaborative Wiki Launch Pack</text>
      
      <!-- Progress indicators -->
      <rect x="0" y="28" width="180" height="6" rx="3" fill="#1e293b" />
      <rect class="progress-fill" x="0" y="28" width="60" height="6" rx="3" fill="url(#cyanGrad)" />
      
      <!-- Grid Layout for cards -->
      <!-- Card 1: Checklist -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="185" height="120" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="12" y="20" fill="#c084fc" font-size="10" font-weight="bold" letter-spacing="0.5">LAUNCH CHECKLIST</text>
        
        <!-- Checklist items with check animations -->
        <g transform="translate(12, 35)">
          <circle cx="6" cy="6" r="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
          <path class="animated-check" d="M 3,6 L 5,8 L 9,4" stroke="#10b981" stroke-width="1.5" fill="none" />
          <text x="18" y="9" fill="#94a3b8" font-size="9">Define positioning strategy</text>
        </g>
        
        <g transform="translate(12, 57)">
          <circle cx="6" cy="6" r="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
          <path class="animated-check" d="M 3,6 L 5,8 L 9,4" stroke="#10b981" stroke-width="1.5" fill="none" style="animation-delay: 1.5s;" />
          <text x="18" y="9" fill="#94a3b8" font-size="9">Set up tracking metrics</text>
        </g>
        
        <g transform="translate(12, 79)">
          <circle cx="6" cy="6" r="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
          <path class="animated-check" d="M 3,6 L 5,8 L 9,4" stroke="#10b981" stroke-width="1.5" fill="none" style="animation-delay: 3s;" />
          <text x="18" y="9" fill="#e2e8f0" font-size="9">Pre-launch QA checks</text>
        </g>
        
        <g transform="translate(12, 101)">
          <rect x="0" y="2" width="10" height="2" fill="#475569"/>
          <text x="18" y="9" fill="#64748b" font-size="9" font-style="italic">+ 12 tasks generated</text>
        </g>
      </g>

      <!-- Card 2: Risks & Blockers -->
      <g transform="translate(200, 48)">
        <rect x="0" y="0" width="185" height="120" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="12" y="20" fill="#f43f5e" font-size="10" font-weight="bold" letter-spacing="0.5">RISKS &amp; MITIGATION</text>
        
        <!-- Table simulation -->
        <g transform="translate(12, 32)">
          <!-- Row 1 -->
          <rect x="0" y="4" width="8" height="8" rx="2" fill="#ef4444" opacity="0.8" />
          <text x="14" y="12" fill="#cbd5e1" font-size="9" font-weight="600">Rate Limits</text>
          <text x="14" y="22" fill="#64748b" font-size="8.5">Caching &amp; Fallbacks</text>
          
          <!-- Row 2 -->
          <rect x="0" y="34" width="8" height="8" rx="2" fill="#f59e0b" opacity="0.8" />
          <text x="14" y="42" fill="#cbd5e1" font-size="9" font-weight="600">User Retention</text>
          <text x="14" y="52" fill="#64748b" font-size="8.5">Refine onboarding flow</text>
          
          <!-- Row 3 -->
          <rect x="0" y="64" width="8" height="8" rx="2" fill="#f59e0b" opacity="0.8" />
          <text x="14" y="72" fill="#cbd5e1" font-size="9" font-weight="600">SEO indexing</text>
          <text x="14" y="82" fill="#64748b" font-size="8.5">Generate sitemaps</text>
        </g>
      </g>

      <!-- Bottom controls bar (Actionable items) -->
      <g transform="translate(0, 180)">
        <rect x="0" y="0" width="385" height="42" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="0.7" />
        <text x="15" y="24" fill="#94a3b8" font-size="9">Export options ready:</text>
        
        <!-- Action Badges -->
        <g transform="translate(115, 11)">
          <rect x="0" y="0" width="70" height="20" rx="4" fill="#312e81" stroke="#6366f1" stroke-width="0.7"/>
          <text x="35" y="13" fill="#e2e8f0" font-size="8.5" font-weight="bold" text-anchor="middle">COPY MD</text>
        </g>
        <g transform="translate(195, 11)">
          <rect x="0" y="0" width="80" height="20" rx="4" fill="#022c22" stroke="#10b981" stroke-width="0.7"/>
          <text x="40" y="13" fill="#e2e8f0" font-size="8.5" font-weight="bold" text-anchor="middle">DOWNLOAD</text>
        </g>
        <g transform="translate(285, 11)">
          <rect x="0" y="0" width="85" height="20" rx="4" fill="#1e1b4b" stroke="#475569" stroke-width="0.7"/>
          <text x="42.5" y="13" fill="#e2e8f0" font-size="8.5" font-weight="bold" text-anchor="middle">REGENERATE</text>
        </g>
      </g>
    </g>
  </g>

  <!-- DYNAMIC ROCKET LAUNCH GRAPHIC (Superimposed & Animated) -->
  <g class="rocket-group" transform="translate(30, 20)">
    <!-- Base Glow Trail -->
    <path class="thruster-flame" d="M 388,240 L 392,270 L 396,240 Z" fill="#f97316" />
    <path class="thruster-flame" d="M 389,240 L 392,260 L 395,240 Z" fill="#fde047" style="animation-delay: -0.07s;" />
    <circle class="star-fast" cx="392" cy="275" r="4" fill="#ef4444" opacity="0.7" />
    <circle class="star-slow" cx="392" cy="285" r="2.5" fill="#f97316" opacity="0.5" />
    
    <!-- Rocket Body -->
    <!-- Fin Left -->
    <path d="M 384,228 L 376,236 L 384,236 Z" fill="#3b82f6" />
    <!-- Fin Right -->
    <path d="M 400,228 L 408,236 L 400,236 Z" fill="#3b82f6" />
    <!-- Body Tube -->
    <rect x="384" y="200" width="16" height="36" rx="2" fill="url(#rocketGrad)" />
    <!-- Nose Cone -->
    <path d="M 384,200 Q 392,184 396,200 Z" fill="#a855f7" />
    <path d="M 384,200 L 392,185 L 392,200 Z" fill="#c084fc" opacity="0.5" /> <!-- shade -->
    <!-- Port Window -->
    <circle cx="392" cy="210" r="3.5" fill="#06b6d4" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="391" cy="209" r="1" fill="#ffffff" />
    <!-- Trim Line -->
    <line x1="384" y1="222" x2="400" y2="222" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- TOP-RIGHT ACCENT ELEMENT (Dashboard Stats Badge) -->
  <g class="floating-dashboard" style="animation-delay: -2s;">
    <g transform="translate(660, 80)">
      <circle class="pulse-circle" cx="0" cy="0" r="4" fill="#06b6d4" />
      <circle cx="0" cy="0" r="5" fill="#06b6d4" />
      <!-- Small float banner -->
      <rect x="-110" y="-35" width="100" height="26" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#0891b2" stroke-width="1" />
      <text x="-102" y="-19" fill="#06b6d4" font-size="7" font-weight="900" letter-spacing="1">ENGINE ONLINE</text>
      <text x="-102" y="-11" fill="#94a3b8" font-size="7">Gemini + OpenAI ready</text>
    </g>
  </g>

  <!-- BRAND LOGO BADGE (Center Bottom) -->
  <g transform="translate(400, 362)">
    <rect x="-100" y="-12" width="200" height="24" rx="12" fill="#1e1b4b" stroke="#312e81" stroke-width="1" />
    <text x="0" y="4" fill="#e2e8f0" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="1.5">
      LAUNCH<tspan fill="#06b6d4">PILOT</tspan> 🚀 <tspan fill="#a855f7" font-weight="500">v1.1.0</tspan>
    </text>
  </g>
</svg>
